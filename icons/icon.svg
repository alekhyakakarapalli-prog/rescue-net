<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Border -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Radar Crosshairs -->
  <line x1="256" y1="46" x2="256" y2="466" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="46" y1="256" x2="466" y2="256" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Shield Base -->
  <path d="M 256 90 L 370 140 C 370 260 256 360 256 390 C 256 360 142 260 142 140 Z" fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Red Cross in Shield -->
  <rect x="236" y="160" width="40" height="120" rx="6" fill="#FFFFFF"/>
  <rect x="196" y="200" width="120" height="40" rx="6" fill="#FFFFFF"/>

  <!-- Mesh Radio Waves radiating from center -->
  <path d="M 170 390 A 110 110 0 0 1 342 390" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 140 420 A 150 150 0 0 1 372 420" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <path d="M 110 450 A 190 190 0 0 1 402 450" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.4"/>

  <!-- Drone Signal Dot -->
  <circle cx="256" cy="390" r="10" fill="#38BDF8" filter="url(#glow)"/>
</svg>
